<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c151e">
<title>AZ Pawn of Salem</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<div id="gate" class="gate">
  <form id="loginForm" class="signin">
    <img class="logo-big" src="img/logo.webp" alt="AZ Pawn of Salem">
    <div class="sub">Pawn &amp; Firearms Retail</div>
    <label class="field"><span>Email</span><input id="em" type="email" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="gold">Sign in</button>
    <p id="err" role="alert"></p>
  </form>
</div>

<header>
  <div class="brand">
    <img class="logo-sm" src="img/logo.webp" alt="AZ Pawn of Salem">
    <div class="wordmark">AZ Pawn<small>of Salem</small></div>
  </div>
  <div class="spacer"></div>
  <div class="pill"><span class="dot" id="dot"></span><span id="status">Online</span></div>
  <div class="who"><b id="whoEmail"></b><span id="whoRole"></span></div>
  <button class="ghost" id="outBtn" hidden>Sign out</button>
</header>

<main>
  <section class="hello">
    <h2 id="greet">Welcome</h2>
    <p id="today"></p>
  </section>

  <section id="chips" style="display:flex;gap:10px;flex-wrap:wrap" hidden></section>

  <section class="grid">
    <button class="tile t-pawn" data-href="pawn.html">
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.500 9.200c-.5-.8-1.400-1.200-2.500-1.200-1.500 0-2.500.8-2.500 2s1 1.700 2.500 2 2.500.8 2.500 2-1 2-2.500 2c-1.100 0-2-.4-2.500-1.200M12 6.500V8M12 16v1.500"/></svg></div>
      <div><h3>PAWN</h3><p>Start a collateral loan</p></div>
    </button>
    <button class="tile t-buy" data-href="buy.html">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M3 7h18v4a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7Z"/><path d="M5 14v5h14v-5M12 7v12M8 7l4-4 4 4"/></svg></div>
      <div><h3>BUY</h3><p>Purchase an item outright</p></div>
    </button>
    <button class="tile t-sell" data-href="sell.html">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M20.500 13.500 13.500 20.500a2 2 0 0 1-2.800 0L3 12.800V3h9.800l7.700 7.700a2 2 0 0 1 0 2.800Z"/><circle cx="7.500" cy="7.500" r="1.300"/></svg></div>
      <div><h3>SELL</h3><p>Retail sale from inventory</p></div>
    </button>
    <button class="tile t-inv" data-href="inventory.html">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></svg></div>
      <div><h3>INVENTORY</h3><p>Browse and manage stock</p></div>
    </button>
    <button class="tile t-fw" data-href="firearms.html">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M4 7h11l2 2h3v4h-6l-1 4H8l1-4H4z"/><path d="M8 7v2"/></svg></div>
      <div><h3>FIREARMS</h3><p>A&amp;D book, 4473 / NICS, transfers</p></div>
    </button>
    <button class="tile t-loan" data-href="loans.html">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/></svg></div>
      <div><h3>LOANS</h3><p>Redeem, renew, look up a loan</p></div>
    </button>
    <button class="tile t-cust" data-href="customers.html">
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.500"/><path d="M2.500 20c0-3.600 2.900-6 6.500-6s6.500 2.400 6.500 6M16 5.500a3.200 3.200 0 0 1 0 6M18 14.500c2.200.6 3.500 2.600 3.500 5.500"/></svg></div>
      <div><h3>CUSTOMERS</h3><p>Look up or add a customer</p></div>
    </button>
  </section>

  <section class="owner-bar" id="ownerBar" hidden>
    <div><b>Owner &amp; Manager</b>Reports, briefing, loans ledger, customers, cash, settings</div>
    <button class="gold" id="ownerBtn">Open owner area</button>
  </section>
</main>
<footer>AZ Pawn of Salem &middot; supports recordkeeping; does not by itself ensure legal compliance</footer>

<div class="area" id="area" hidden><div class="area-in">
  <div class="area-top"><h2>Owner &amp; Manager</h2>
    <button class="ghost" id="chgPin">Change PIN</button><button class="gold" id="lockBtn">Lock</button></div>
  <div class="mods" id="mods"></div>
</div></div>

<dialog id="dlg"><p id="msg"></p><form method="dialog"><button class="ghost">Close</button></form></dialog>

<script type="module">
  import { watchAuth, login, logout } from './js/firebase.js';
  import { askPin, isUnlocked, markUnlocked, clearUnlocked, IDLE_MS } from './js/pin-gate.js';
  const $ = (id) => document.getElementById(id);
  const open = (t) => { $('msg').textContent = t; $('dlg').showModal(); };
  let role = null, uid = null;

  // ---- owner PIN gate ----
  const MODS = [['Reports of the Day', 'daily.html'], ['Briefing', 'briefing.html'], ['Reports & insights', 'reports.html'], ['Loans ledger', 'loans.html'], ['Customers', 'customers.html'], ['Inventory management', 'inventory.html'],
    ['Firearms A&D book', 'firearms.html'], ['Messaging'], ['Reminders'], ['Cash management'], ['Settings', 'settings.html', true]];
  $('mods').innerHTML = MODS.map(([n, href]) => href
    ? `<a class="mod" href="${href}" data-owner="${MODS.find(m => m[0] === n)[2] ? 1 : ''}" style="text-decoration:none;color:inherit;cursor:pointer"><em style="color:var(--good)">Open</em><b>${n}</b><span>${n === 'Settings' ? 'Owner only: shop, loan terms, ticket, compliance' : 'Open this page'}</span></a>`
    : `<div class="mod"><em>Soon</em><b>${n}</b><span>Coming in a later build step</span></div>`).join('');
  $('mods').onclick = (e) => { const a = e.target.closest('a[data-owner="1"]'); if (a && role !== 'owner') { e.preventDefault(); open('Settings are owner only.'); } };
  let timer = null;
  function lock() { $('area').hidden = true; clearTimeout(timer); clearUnlocked(); }
  function bump() { clearTimeout(timer); timer = setTimeout(lock, IDLE_MS); markUnlocked(); }
  const pinErr = () => open('Could not reach the server to check your PIN. Check your connection.');
  async function openOwner() {
    if (!(role === 'owner' || role === 'manager')) return open('Owner/Manager access required.');
    if (!$('area').hidden) return;
    try { if (isUnlocked() || await askPin(uid)) { $('area').hidden = false; bump(); } } catch { pinErr(); }
  }
  $('lockBtn').onclick = lock;
  $('chgPin').onclick = async () => { try { if (await askPin(uid, { change: true })) bump(); } catch { pinErr(); } };
  ['pointerdown', 'keydown', 'scroll'].forEach(ev => $('area').addEventListener(ev, () => !$('area').hidden && bump(), true));

  document.querySelectorAll('.tile[data-href]').forEach(b => b.onclick = () => { location.href = b.dataset.href; });
  document.querySelectorAll('.tile[data-go]').forEach(b => b.onclick = () =>
    open(b.dataset.go.toUpperCase() + ' flow: coming in a later build step.'));
  $('ownerBtn').onclick = () => openOwner();
  $('outBtn').onclick = logout;
  $('loginForm').onsubmit = async (e) => {
    e.preventDefault(); $('err').textContent = '';
    try { await login($('em').value, $('pw').value); }
    catch { $('err').textContent = 'Sign-in failed. Check your email and password.'; }
  };

  async function chips() {
    try {
      const { loadAlerts } = await import('./js/insights-data.js'), { alerts: a } = await loadAlerts();
      const c = [[a.readyToForfeit.length, 'ready to forfeit', 'loans.html?filter=defaulted', 1], [a.defaultedToday.length, 'defaulted today', 'loans.html?filter=defaulted', 1], [a.maturingSoon.length, 'loans maturing soon', 'loans.html?filter=maturing-soon'],
        [a.overdue.length, 'overdue', 'loans.html?filter=overdue'], [a.holdEndingToday.length + a.holdEnded.length, 'items past their hold', 'inventory.html'], [a.needsAd.length, 'firearms need A&D entry', 'firearms.html', 1]].filter((x) => x[0]);
      $('chips').innerHTML = c.map(([n, t, href, bad]) => `<a href="${href}" class="pill" style="text-decoration:none;${bad ? 'border-color:var(--bad);color:var(--text)' : ''}"><b style="color:${bad ? 'var(--bad)' : 'var(--accent)'}">${n}</b>&nbsp;${t}</a>`).join(''); $('chips').hidden = !c.length;
    } catch { /* alerts are optional */ }
  }
  watchAuth((user, r) => {
    role = r; uid = user ? user.uid : null; if (user && r) chips();
    if (!user) lock();
    const ok = !!user && !!r;
    $('gate').hidden = ok;
    $('outBtn').hidden = !user;
    $('ownerBar').hidden = !(r === 'owner' || r === 'manager');
    $('whoEmail').textContent = user ? user.email : '';
    $('whoRole').textContent = r || '';
    if (user && !r) { $('err').textContent = 'No role assigned to this account. Ask the owner.'; }
  });

  const fmt = { timeZone: 'America/New_York' };
  function tick() {
    const now = new Date(), h = Number(now.toLocaleString('en-US', { ...fmt, hour: 'numeric', hour12: false }));
    $('greet').textContent = (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening');
    $('today').textContent = now.toLocaleString('en-US', { ...fmt, weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  tick(); setInterval(tick, 30000);

  const sync = () => { const on = navigator.onLine; $('status').textContent = on ? 'Online' : 'Offline: changes will queue'; $('dot').classList.toggle('off', !on); };
  addEventListener('online', sync); addEventListener('offline', sync); sync();
</script>
</body>
</html>
