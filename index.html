<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c151e">
<title>AZ Pawn of Salem</title>
<style>
  :root {
    --accent:#f5b52e;            /* from the AZ Pawn logo: sunburst gold */
    --accent-soft:rgba(245,181,46,.16);
    --bg:#0c151e; --panel:#132130; --panel-2:#182a3c; --line:#233a50; --line-2:#2f4a65;
    --text:#fdf3d6; --muted:#93a6b8; --good:#3ecf8e; --bad:#ff6b6b;
    --radius:20px;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; color:var(--text); font:16px/1.45 Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(239,90,31,.10), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(43,138,163,.12), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    min-height:100dvh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  button { font:inherit; color:inherit; }

  /* ---------- header ---------- */
  header {
    display:flex; align-items:center; gap:16px; padding:14px max(20px, env(safe-area-inset-left));
    border-bottom:1px solid var(--line); background:rgba(12,21,30,.78); backdrop-filter:blur(14px);
    position:sticky; top:0; z-index:5;
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .mark { width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
    background:none; box-shadow:none; }
  .mark svg { width:22px; height:22px; fill:#14100a; }
  .wordmark { font-weight:800; letter-spacing:.22em; font-size:1.05rem; text-transform:uppercase; }
  .wordmark small { display:block; font-weight:500; letter-spacing:.18em; font-size:.62rem; color:var(--muted); margin-top:1px; }
  .spacer { flex:1; }
  .pill { display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border:1px solid var(--line);
    border-radius:999px; color:var(--muted); font-size:.82rem; background:var(--panel); white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 0 4px rgba(62,207,142,.15); }
  .dot.off { background:var(--bad); box-shadow:0 0 0 4px rgba(255,107,107,.15); }
  .who { display:flex; flex-direction:column; align-items:flex-end; line-height:1.15; }
  .who b { font-size:.88rem; font-weight:600; }
  .who span { font-size:.7rem; color:var(--accent); text-transform:uppercase; letter-spacing:.14em; }
  .ghost { background:none; border:1px solid var(--line); border-radius:10px; padding:9px 14px; cursor:pointer;
    color:var(--muted); transition:.15s; }
  .ghost:hover { color:var(--text); border-color:var(--accent); }
  [hidden] { display:none !important; }

  /* ---------- hub ---------- */
  main { flex:1; width:100%; max-width:1040px; margin:0 auto; padding:34px 20px 20px; display:flex; flex-direction:column; gap:26px; }
  .hello h2 { margin:0; font-size:clamp(1.5rem, 3.2vw, 2.1rem); font-weight:700; letter-spacing:-.01em; }
  .hello p { margin:4px 0 0; color:var(--muted); }
  .grid { display:grid; gap:18px; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); }
  .tile {
    position:relative; overflow:hidden; text-align:left; cursor:pointer;
    min-height:190px; padding:24px; border-radius:var(--radius);
    background:linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid var(--line); display:flex; flex-direction:column; justify-content:space-between;
    transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s, box-shadow .18s;
  }
  .tile::after { content:""; position:absolute; inset:auto -40% -60% auto; width:280px; height:280px; border-radius:50%;
    background:radial-gradient(circle, var(--tint, var(--accent)) 0%, transparent 65%); opacity:.14; transition:opacity .25s; }
  .tile:hover, .tile:focus-visible { transform:translateY(-4px); border-color:var(--tint, var(--accent)); outline:none;
    box-shadow:0 18px 40px rgba(0,0,0,.45), 0 0 0 1px var(--tint, var(--accent)) inset; }
  .tile:hover::after { opacity:.28; }
  .tile:active { transform:translateY(-1px) scale(.985); }
  .ico { width:52px; height:52px; border-radius:15px; display:grid; place-items:center; position:relative; z-index:1;
    background:color-mix(in srgb, var(--tint, var(--accent)) 16%, transparent);
    border:1px solid color-mix(in srgb, var(--tint, var(--accent)) 40%, transparent); }
  .ico svg { width:26px; height:26px; stroke:var(--tint, var(--accent)); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tile h3 { margin:0; font-size:1.55rem; letter-spacing:.1em; font-weight:800; position:relative; z-index:1; }
  .tile p { margin:4px 0 0; color:var(--muted); font-size:.92rem; position:relative; z-index:1; }
  .t-pawn { --tint:#f5b52e; } .t-buy { --tint:#3fb6d0; } .t-sell { --tint:#ef6a2e; } .t-inv { --tint:#e0463c; }

  .owner-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:16px 20px; border:1px solid var(--line); border-radius:16px; background:var(--panel); }
  .owner-bar div { color:var(--muted); font-size:.9rem; }
  .owner-bar b { color:var(--text); display:block; font-size:1rem; }
  .gold { background:var(--accent); color:#14202b; border:0; border-radius:12px; padding:12px 20px; font-weight:700;
    cursor:pointer; transition:.15s; box-shadow:0 6px 18px rgba(245,181,46,.28); }
  .gold:hover { filter:brightness(1.08); transform:translateY(-1px); }
  footer { padding:18px; text-align:center; color:var(--muted); font-size:.75rem; }

  /* ---------- sign-in ---------- */
  .gate { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:20px;
    background:
      radial-gradient(800px 500px at 50% -10%, rgba(239,90,31,.20), transparent 60%),
      radial-gradient(700px 500px at 100% 110%, rgba(43,138,163,.14), transparent 60%), var(--bg); }
  .card { width:min(400px,100%); padding:34px 30px 28px; border-radius:24px; background:linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid var(--line-2); box-shadow:0 30px 80px rgba(0,0,0,.55); }
  .logo-big { display:block; width:200px; max-width:60%; margin:0 auto 10px; border-radius:18px; box-shadow:0 14px 40px rgba(0,0,0,.5); }
  .logo-sm { width:46px; height:46px; border-radius:10px; object-fit:cover; box-shadow:0 4px 14px rgba(0,0,0,.4); }
  .card .mark { width:56px; height:56px; border-radius:16px; margin:0 auto 18px; }
  .card .mark svg { width:32px; height:32px; }
  .card h2 { margin:0; text-align:center; font-size:1.5rem; letter-spacing:.2em; text-transform:uppercase; font-weight:800; }
  .card .sub { text-align:center; color:var(--muted); margin:6px 0 24px; font-size:.9rem; }
  .field { display:block; margin-bottom:14px; }
  .field span { display:block; font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .field input { width:100%; background:#0a121a; border:1px solid var(--line-2); border-radius:12px; color:var(--text);
    padding:14px 15px; font:inherit; transition:.15s; }
  .field input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .card .gold { width:100%; padding:15px; font-size:1rem; margin-top:6px; }
  #err { color:var(--bad); margin:14px 0 0; min-height:1.3em; text-align:center; font-size:.88rem; }

  /* ---------- dialog ---------- */
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line-2); border-radius:20px; padding:26px; max-width:min(420px, 92vw);
    box-shadow:0 30px 80px rgba(0,0,0,.6); }
  dialog::backdrop { background:rgba(4,6,10,.7); backdrop-filter:blur(4px); }
  dialog p { margin:0 0 18px; }

  /* ---------- PIN + owner area ---------- */
  .pinbox { width:min(340px,86vw); text-align:center; }
  .pinbox h3 { margin:0 0 4px; font-size:1.2rem; }
  .pinbox .hint { color:var(--muted); font-size:.88rem; min-height:1.3em; margin:0 0 18px; }
  .dots { display:flex; justify-content:center; gap:14px; margin-bottom:8px; }
  .dots i { width:14px; height:14px; border-radius:50%; border:2px solid var(--line-2); transition:.12s; }
  .dots i.on { background:var(--accent); border-color:var(--accent); }
  .dots.shake { animation:shake .35s; }
  @keyframes shake { 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .keys { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px; }
  .keys button { height:58px; border-radius:14px; border:1px solid var(--line); background:var(--panel-2); font-size:1.35rem;
    font-weight:600; cursor:pointer; transition:.1s; }
  .keys button:hover { border-color:var(--accent); } .keys button:active { transform:scale(.95); background:var(--accent-soft); }
  .keys .sm { font-size:.85rem; color:var(--muted); font-weight:500; }
  #pinMsg { color:var(--bad); }
  .area { position:fixed; inset:0; z-index:15; overflow:auto; background:var(--bg); padding:0 20px 40px; }
  .area-in { max-width:1040px; margin:0 auto; }
  .area-top { display:flex; align-items:center; gap:12px; padding:18px 0; flex-wrap:wrap; }
  .area-top h2 { margin:0; flex:1; font-size:1.5rem; }
  .mods { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .mod { padding:20px; border:1px solid var(--line); border-radius:16px; background:linear-gradient(160deg,var(--panel-2),var(--panel)); }
  .mod b { display:block; margin-bottom:4px; } .mod span { color:var(--muted); font-size:.85rem; }
  .mod em { float:right; font-style:normal; font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  @media (max-width:600px) {
    .who { display:none; } .tile { min-height:150px; padding:20px; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<div id="gate" class="gate">
  <form id="loginForm" class="card">
    <img class="logo-big" src="img/logo.webp" alt="AZ Pawn of Salem">
    <div class="sub">Pawn &amp; Firearms Retail</div>
    <label class="field"><span>Email</span><input id="em" type="email" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="gold">Sign in</button>
    <p id="err" role="alert"></p>
  </form>
</div>

<header>
  <div class="brand">
    <img class="logo-sm" src="img/logo.webp" alt="AZ Pawn of Salem">
    <div class="wordmark">AZ Pawn<small>of Salem</small></div>
  </div>
  <div class="spacer"></div>
  <div class="pill"><span class="dot" id="dot"></span><span id="status">Online</span></div>
  <div class="who"><b id="whoEmail"></b><span id="whoRole"></span></div>
  <button class="ghost" id="outBtn" hidden>Sign out</button>
</header>

<main>
  <section class="hello">
    <h2 id="greet">Welcome</h2>
    <p id="today"></p>
  </section>

  <section class="grid">
    <button class="tile t-pawn" data-go="pawn">
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.500 9.200c-.5-.8-1.400-1.200-2.500-1.200-1.500 0-2.500.8-2.500 2s1 1.700 2.500 2 2.500.8 2.500 2-1 2-2.500 2c-1.100 0-2-.4-2.500-1.200M12 6.500V8M12 16v1.500"/></svg></div>
      <div><h3>PAWN</h3><p>Start a collateral loan</p></div>
    </button>
    <button class="tile t-buy" data-go="buy">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M3 7h18v4a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7Z"/><path d="M5 14v5h14v-5M12 7v12M8 7l4-4 4 4"/></svg></div>
      <div><h3>BUY</h3><p>Purchase an item outright</p></div>
    </button>
    <button class="tile t-sell" data-go="sell">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M20.500 13.500 13.500 20.500a2 2 0 0 1-2.800 0L3 12.800V3h9.800l7.700 7.700a2 2 0 0 1 0 2.800Z"/><circle cx="7.500" cy="7.500" r="1.300"/></svg></div>
      <div><h3>SELL</h3><p>Retail sale from inventory</p></div>
    </button>
    <button class="tile t-inv" data-go="inventory">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></svg></div>
      <div><h3>INVENTORY</h3><p>Browse and manage stock</p></div>
    </button>
  </section>

  <section class="owner-bar" id="ownerBar" hidden>
    <div><b>Owner &amp; Manager</b>Reports, briefing, loans ledger, customers, cash, settings</div>
    <button class="gold" id="ownerBtn">Open owner area</button>
  </section>
</main>
<footer>AZ Pawn of Salem &middot; supports recordkeeping; does not by itself ensure legal compliance</footer>

<dialog id="pinDlg"><div class="pinbox">
  <h3 id="pinTitle">Enter PIN</h3><p class="hint" id="pinHint"></p>
  <div class="dots" id="dots"></div><p class="hint" id="pinMsg" role="alert"></p>
  <div class="keys" id="keys"></div>
</div></dialog>

<div class="area" id="area" hidden><div class="area-in">
  <div class="area-top"><h2>Owner &amp; Manager</h2>
    <button class="ghost" id="chgPin">Change PIN</button><button class="gold" id="lockBtn">Lock</button></div>
  <div class="mods" id="mods"></div>
</div></div>

<dialog id="dlg"><p id="msg"></p><form method="dialog"><button class="ghost">Close</button></form></dialog>

<script type="module">
  import { watchAuth, login, logout } from './js/firebase.js';
  import { hasPin, setPin, verifyPin } from './js/pin.js';
  import { PIN_LENGTH } from './js/pin-crypto.js';
  const $ = (id) => document.getElementById(id);
  const open = (t) => { $('msg').textContent = t; $('dlg').showModal(); };
  let role = null, uid = null;

  // ---- owner PIN gate ----
  const MODS = ['Reports of the Day','Briefing','Loans ledger','Customers','Inventory management','Messaging','Reminders','Cash management','Settings'];
  $('mods').innerHTML = MODS.map(m => `<div class="mod"><em>Soon</em><b>${m}</b><span>Coming in a later build step</span></div>`).join('');
  const pin = { buf: '', mode: 'enter', first: '', busy: false };
  const TITLES = { enter: ['Enter PIN', 'Owner area is locked'], create: ['Create your PIN', `Choose ${PIN_LENGTH} digits`], confirm: ['Confirm PIN', 'Enter it once more'] };
  $('keys').innerHTML = [1,2,3,4,5,6,7,8,9,'Cancel',0,'⌫'].map(k =>
    `<button data-k="${k}" class="${typeof k === 'string' ? 'sm' : ''}">${k}</button>`).join('');
  function paint() {
    $('dots').innerHTML = Array.from({ length: PIN_LENGTH }, (_, i) => `<i class="${i < pin.buf.length ? 'on' : ''}"></i>`).join('');
    const [t, h] = TITLES[pin.mode]; $('pinTitle').textContent = t; $('pinHint').textContent = h;
  }
  function fail(text) { $('pinMsg').textContent = text; const d = $('dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
  let timer = null, idleMs = 10 * 60 * 1000;
  function lock() { $('area').hidden = true; clearTimeout(timer); }
  function bump() { clearTimeout(timer); timer = setTimeout(lock, idleMs); }
  function unlock() { $('pinDlg').close(); $('area').hidden = false; bump(); }
  async function openOwner() {
    if (!(role === 'owner' || role === 'manager')) return open('Owner/Manager access required.');
    if (!$('area').hidden) return;
    Object.assign(pin, { buf: '', first: '', busy: false }); $('pinMsg').textContent = '';
    try { pin.mode = (await hasPin(uid)) ? 'enter' : 'create'; }
    catch { return open('Could not reach the server to check your PIN. Check your connection.'); }
    paint(); $('pinDlg').showModal();
  }
  async function complete() {
    const code = pin.buf; pin.buf = ''; pin.busy = true; paint();
    try {
      if (pin.mode === 'create') { pin.first = code; pin.mode = 'confirm'; }
      else if (pin.mode === 'confirm') {
        if (code !== pin.first) { pin.mode = 'create'; fail('PINs did not match. Start again.'); }
        else { await setPin(uid, code); unlock(); }
      } else {
        const r = await verifyPin(uid, code);
        if (r.ok) unlock();
        else fail(r.lockedMs ? `Too many tries. Locked for ${Math.ceil(r.lockedMs / 60000)} min.` : 'Incorrect PIN');
      }
    } catch { fail('Something went wrong. Check your connection.'); }
    pin.busy = false; paint();
  }
  function press(k) {
    if (pin.busy) return; $('pinMsg').textContent = '';
    if (k === 'Cancel') return $('pinDlg').close();
    if (k === '⌫') pin.buf = pin.buf.slice(0, -1);
    else if (/^\d$/.test(k) && pin.buf.length < PIN_LENGTH) pin.buf += k;
    paint(); if (pin.buf.length === PIN_LENGTH) complete();
  }
  $('keys').onclick = (e) => { const b = e.target.closest('button'); if (b) press(b.dataset.k); };
  $('pinDlg').addEventListener('keydown', (e) => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫'); });
  $('lockBtn').onclick = lock;
  $('chgPin').onclick = () => { Object.assign(pin, { mode: 'create', buf: '', first: '' }); $('pinMsg').textContent = ''; paint(); $('pinDlg').showModal(); };
  ['pointerdown', 'keydown', 'scroll'].forEach(ev => $('area').addEventListener(ev, () => !$('area').hidden && bump(), true));

  document.querySelectorAll('.tile[data-go]').forEach(b => b.onclick = () =>
    open(b.dataset.go.toUpperCase() + ' flow: coming in a later build step.'));
  $('ownerBtn').onclick = () => openOwner();
  $('outBtn').onclick = logout;
  $('loginForm').onsubmit = async (e) => {
    e.preventDefault(); $('err').textContent = '';
    try { await login($('em').value, $('pw').value); }
    catch { $('err').textContent = 'Sign-in failed. Check your email and password.'; }
  };

  watchAuth((user, r) => {
    role = r; uid = user ? user.uid : null;
    if (!user) lock();
    const ok = !!user && !!r;
    $('gate').hidden = ok;
    $('outBtn').hidden = !user;
    $('ownerBar').hidden = !(r === 'owner' || r === 'manager');
    $('whoEmail').textContent = user ? user.email : '';
    $('whoRole').textContent = r || '';
    if (user && !r) { $('err').textContent = 'No role assigned to this account. Ask the owner.'; }
  });

  const fmt = { timeZone: 'America/New_York' };
  function tick() {
    const now = new Date(), h = Number(now.toLocaleString('en-US', { ...fmt, hour: 'numeric', hour12: false }));
    $('greet').textContent = (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening');
    $('today').textContent = now.toLocaleString('en-US', { ...fmt, weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  tick(); setInterval(tick, 30000);

  const sync = () => { const on = navigator.onLine; $('status').textContent = on ? 'Online' : 'Offline: changes will queue'; $('dot').classList.toggle('off', !on); };
  addEventListener('online', sync); addEventListener('offline', sync); sync();
</script>
</body>
</html>
