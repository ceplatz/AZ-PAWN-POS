<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c151e">
<title>Reminders · AZ Pawn of Salem</title>
<link rel="stylesheet" href="css/theme.css">
<style>
  input { background:#0a121a; border:1px solid var(--line-2); border-radius:12px; color:var(--text); padding:11px 14px; font:inherit; } main { max-width:820px; }
  .card { border:1px solid var(--line); border-radius:16px; padding:16px; background:linear-gradient(160deg,var(--panel-2),var(--panel)); } .card h3 { margin:0 0 8px; font-size:.78rem; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .days label { display:inline-flex; gap:4px; align-items:center; margin-right:8px; color:var(--muted); font-size:.85rem; } .days input { width:auto; }
  .row { display:flex; gap:12px; align-items:center; padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:var(--panel-2); margin-top:8px; flex-wrap:wrap; } .row .sp { flex:1; } .muted { color:var(--muted); font-size:.85rem; } .off { opacity:.5; }
  .msg { min-height:1.4em; margin:8px 0 0; } .msg.bad { color:var(--bad); } [hidden] { display:none !important; }
</style>
</head>
<body>
<header><a class="ghost" href="index.html" style="text-decoration:none">&larr; Home</a><div class="wordmark" style="margin-left:6px">Reminders</div><div class="spacer"></div><div class="pill"><span class="dot" id="dot"></span><span id="status">Online</span></div></header>
<main id="page" hidden>
  <div class="card"><h3>New recurring reminder</h3><div class="bar"><input id="text" placeholder="e.g. Count the drawer, check the safe, call about maturing loans" style="flex:1;min-width:240px"><input type="time" id="time" value="09:00"></div>
    <div class="days bar" style="margin-top:10px" id="days"></div><div class="bar"><button class="gold" id="add">Add reminder</button><span class="muted">No days ticked = every day. Times are Eastern. Staff see the reminder on the home screen once its time has passed, until someone taps Done.</span></div><p class="msg" id="msg" role="alert"></p></div>
  <div id="list"></div>
</main>
<script type="module">
  import { watchAuth } from './js/firebase.js';
  import { listReminders, addReminder, setActive, removeReminder } from './js/reminders.js';
  import { validReminder } from './js/reminders-logic.js';
  const $ = (id) => document.getElementById(id), esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const D = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; let role = null;
  $('days').innerHTML = D.map((d, i) => `<label><input type="checkbox" value="${i}">${d}</label>`).join('');
  async function load() { try { const rs = await listReminders();
    $('list').innerHTML = rs.map((r) => `<div class="row ${r.active === false ? 'off' : ''}"><b>${esc(r.time)}</b><span>${esc(r.text)}</span><span class="sp"></span><span class="muted">${r.days?.length ? r.days.map((d) => D[d]).join(' ') : 'every day'}</span><button class="ghost" data-t="${r.id}" data-a="${r.active === false ? 1 : 0}">${r.active === false ? 'Turn on' : 'Turn off'}</button>${role === 'owner' ? `<button class="ghost" data-d="${r.id}">Delete</button>` : ''}</div>`).join('') || '<p class="muted">No reminders yet.</p>'; }
    catch { $('list').innerHTML = '<p class="muted">Could not load. Check your connection.</p>'; } }
  $('list').onclick = async (e) => { const t = e.target.dataset; try { if (t.t) await setActive(t.t, t.a === '1'); else if (t.d && confirm('Delete this reminder?')) await removeReminder(t.d); else return; await load(); } catch { $('msg').textContent = 'Could not save.'; $('msg').className = 'msg bad'; } };
  $('add').onclick = async () => { const r = { text: $('text').value, time: $('time').value, days: [...document.querySelectorAll('#days input:checked')].map((c) => +c.value) }, err = validReminder(r);
    if (err) { $('msg').textContent = err; $('msg').className = 'msg bad'; return; } try { await addReminder(r); $('text').value = ''; $('msg').textContent = ''; await load(); } catch { $('msg').textContent = 'Could not save.'; $('msg').className = 'msg bad'; } };
  watchAuth((u, r) => { if (!u || !r || r === 'staff') return location.replace('index.html'); role = r; $('page').hidden = false; load(); });
  const sync = () => { const on = navigator.onLine; $('status').textContent = on ? 'Online' : 'Offline'; $('dot').classList.toggle('off', !on); }; addEventListener('online', sync); addEventListener('offline', sync); sync();
</script>
</body>
</html>
