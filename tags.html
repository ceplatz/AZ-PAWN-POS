<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c151e">
<title>Print tags · AZ Pawn of Salem</title>
<link rel="stylesheet" href="css/theme.css">
<style id="pagecss"></style>
<style>
  input, select { background:#0a121a; border:1px solid var(--line-2); border-radius:12px; color:var(--text); padding:10px 12px; font:inherit; } main { max-width:1000px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .muted { color:var(--muted); font-size:.85rem; } .card { border:1px solid var(--line); border-radius:16px; padding:16px; background:var(--panel); }
  .row { display:flex; gap:12px; align-items:center; padding:8px 12px; border:1px solid var(--line); border-radius:12px; background:var(--panel-2); margin-top:8px; flex-wrap:wrap; } .row .sp { flex:1; } .row input[type=number] { width:70px; } .row input[type=checkbox] { width:auto; }
  .tag { font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--line-2); border-radius:999px; padding:2px 8px; color:var(--accent); }
  .preview { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; } .lbl { background:#fff; color:#000; border:1px dashed #888; padding:.06in .08in; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; box-sizing:border-box; width:var(--w); height:var(--h); font-family:Arial,sans-serif; }
  .lbl .shop { font-size:7pt; letter-spacing:.08em; text-transform:uppercase; } .lbl .title { font-size:9pt; font-weight:700; line-height:1.15; max-height:2.3em; overflow:hidden; } .lbl .price { font-size:15pt; font-weight:800; } .lbl .sn { font-size:6.5pt; }
  .lbl svg { width:100%; height:.36in; display:block; } .lbl .code { font-size:6.5pt; text-align:center; letter-spacing:.1em; }
  #sheet { display:none; } @media print { body > *:not(#sheet) { display:none !important; } #sheet { display:flex !important; flex-wrap:wrap; } #sheet .lbl { border:0; break-inside:avoid; page-break-after:always; } }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header><a class="ghost" href="index.html" style="text-decoration:none">&larr; Home</a><div class="wordmark" style="margin-left:6px">Print tags</div><div class="spacer"></div><div class="pill"><span class="dot" id="dot"></span><span id="status">Online</span></div></header>
<main id="page" hidden>
  <div class="card"><div class="bar"><label class="muted">Label width (in) <input type="number" id="lw" value="2.25" step="0.05" min="1" style="width:90px"></label><label class="muted">Height (in) <input type="number" id="lh" value="1.25" step="0.05" min="0.5" style="width:90px"></label>
    <label class="muted">Show <select id="fs"><option value="avail">For sale and on hold</option><option value="all">All unsold items</option></select></label><input id="q" type="search" placeholder="Search" style="flex:1;min-width:160px"><button class="ghost" id="all">Select all shown</button><button class="gold" id="print">Print labels</button></div>
    <p class="muted" style="margin:8px 0 0">Set the size to match your label stock, then choose Print and pick your label printer. The barcode is the item's 10-character code; the SELL screen finds the item when you scan it (click the search box first).</p></div>
  <div id="list"></div>
  <h3 style="margin:12px 0 0">Preview</h3><div class="preview" id="preview"></div>
</main>
<div id="sheet"></div>
<script type="module">
  import { watchAuth } from './js/firebase.js';
  import { listItems } from './js/items.js';
  import { fmtMoney, scanCode } from './js/item-logic.js';
  import { barcodeSvg } from './js/code128.js';
  import { CONFIG } from './js/config.js';
  const $ = (id) => document.getElementById(id), esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let items = [], pick = {};   // pick[id] = copies
  watchAuth(async (u, r) => { if (!u || !r) return location.replace('index.html'); $('page').hidden = false;
    try { items = await listItems(1000); paint(); } catch { $('list').innerHTML = '<p class="muted">Could not load inventory. Check your connection.</p>'; } });
  const shown = () => { const q = $('q').value.trim().toLowerCase(), ok = $('fs').value === 'all' ? (i) => i.status !== 'sold' && i.status !== 'released' : (i) => ['for-sale', 'on-hold'].includes(i.status);
    return items.filter((i) => ok(i) && (!q || [i.title, i.brand, i.model, i.serial, i.location].join(' ').toLowerCase().includes(q))).slice(0, 300); };
  function label(i) {
    let code = ''; try { code = barcodeSvg(scanCode(i.id)); } catch { code = ''; }
    return `<div class="lbl"><div class="shop">${esc(CONFIG.shop.name)}</div><div class="title">${esc(i.title)}</div><div><span class="price">${i.askPrice != null ? fmtMoney(i.askPrice) : ''}</span> <span class="sn">${i.serial ? 'SN ' + esc(i.serial) : ''}</span></div>${code}<div class="code">${esc(scanCode(i.id))}</div></div>`;
  }
  function paint() {
    const rows = shown(); $('list').innerHTML = rows.map((i) => `<div class="row"><input type="checkbox" data-c="${i.id}" ${pick[i.id] ? 'checked' : ''}><b>${esc(i.title)}</b><span class="muted">${esc(i.category)}${i.serial ? ' · SN ' + esc(i.serial) : ''}</span><span class="sp"></span><span class="tag">${esc(i.status)}</span><b>${fmtMoney(i.askPrice)}</b><label class="muted">copies <input type="number" min="1" max="20" value="${pick[i.id] || 1}" data-n="${i.id}"></label></div>`).join('') || '<p class="muted">No items.</p>';
    preview();
  }
  function setSize() { const w = +$('lw').value || 2.25, h = +$('lh').value || 1.25; document.documentElement.style.setProperty('--w', w + 'in'); document.documentElement.style.setProperty('--h', h + 'in'); $('pagecss').textContent = `@page { size: ${w}in ${h}in; margin: 0; }`; }
  function preview() { setSize(); const sel = items.filter((i) => pick[i.id]); $('preview').innerHTML = sel.slice(0, 12).map(label).join('') || '<span class="muted">Tick items above to preview their tags.</span>'; }
  $('list').onchange = (e) => { const c = e.target.dataset.c, n = e.target.dataset.n; if (c) pick[c] = e.target.checked ? (+document.querySelector(`[data-n="${c}"]`).value || 1) : 0; if (n && pick[n]) pick[n] = Math.max(1, Math.min(20, +e.target.value || 1)); preview(); };
  $('all').onclick = () => { shown().forEach((i) => { pick[i.id] = pick[i.id] || 1; }); paint(); };
  $('q').oninput = $('fs').onchange = paint; $('lw').oninput = $('lh').oninput = preview;
  $('print').onclick = () => { const sel = items.filter((i) => pick[i.id]); if (!sel.length) return alert('Tick at least one item.'); setSize(); $('sheet').innerHTML = sel.flatMap((i) => Array.from({ length: pick[i.id] }, () => label(i))).join(''); print(); };
  const sync = () => { const on = navigator.onLine; $('status').textContent = on ? 'Online' : 'Offline'; $('dot').classList.toggle('off', !on); }; addEventListener('online', sync); addEventListener('offline', sync); sync();
</script>
</body>
</html>
